<svg viewBox="0 0 460 210" width="100%" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Ubuntu', 'DejaVu Sans', 'Liberation Sans', sans-serif;">
  <defs>
    <marker id="s-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 2 L 6 5 L 0 8 z" fill="#475569" />
    </marker>
    <marker id="s-arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 2 L 6 5 L 0 8 z" fill="#dc2626" />
    </marker>
    <filter id="sub-sh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="0" y="0" width="460" height="210" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Layer 2: Top Layer (STAY-IN-MIDDLE) -->
  <rect x="10" y="8" width="440" height="58" rx="4" fill="#f5f3ff" stroke="#a78bfa" stroke-width="0.8" stroke-dasharray="4 3"/>
  <rect x="16" y="12" width="118" height="15" rx="3" fill="#7c3aed"/>
  <text x="75" y="22" text-anchor="middle" font-size="6.2" font-weight="bold" fill="#ffffff">Layer 2: STAY-IN-MIDDLE</text>
  
  <!-- LOOK PS -->
  <g filter="url(#sub-sh)">
    <rect x="145" y="16" width="65" height="26" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="177" y="27" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#5b21b6">LOOK (PS)</text>
    <text x="177" y="36" text-anchor="middle" font-size="5" fill="#64748b">Corridor width</text>
  </g>
  <path d="M 210 29 L 240 29" stroke="#64748b" stroke-width="1.2" marker-end="url(#s-arr)"/>
  
  <!-- STAY IN MIDDLE MS -->
  <g filter="url(#sub-sh)">
    <rect x="242" y="16" width="95" height="26" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="289" y="27" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#5b21b6">STAY IN MIDDLE (MS)</text>
    <text x="289" y="36" text-anchor="middle" font-size="5" fill="#64748b">Heading to middle</text>
  </g>

  <!-- Layer 1: Middle Layer (OBSTACLE AVOIDANCE) -->
  <rect x="10" y="72" width="440" height="58" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="0.8" stroke-dasharray="4 3"/>
  <rect x="16" y="76" width="138" height="15" rx="3" fill="#0284c7"/>
  <text x="85" y="86" text-anchor="middle" font-size="6.2" font-weight="bold" fill="#ffffff">Layer 1: OBSTACLE AVOIDANCE</text>

  <!-- WANDER -->
  <g filter="url(#sub-sh)">
    <rect x="160" y="82" width="60" height="24" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="190" y="94" text-anchor="middle" font-size="6.2" font-weight="bold" fill="#0369a1">WANDER</text>
    <text x="190" y="101" text-anchor="middle" font-size="4.8" fill="#64748b">Random forces</text>
  </g>

  <!-- Suppression Circle S -->
  <circle cx="260" cy="94" r="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="260" y="97" text-anchor="middle" font-size="7" font-weight="bold" fill="#dc2626">S</text>

  <!-- AVOID -->
  <g filter="url(#sub-sh)">
    <rect x="290" y="82" width="85" height="24" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="332" y="93" text-anchor="middle" font-size="6.2" font-weight="bold" fill="#0369a1">AVOID</text>
    <text x="332" y="101" text-anchor="middle" font-size="4.8" fill="#64748b">Modified heading</text>
  </g>
  <path d="M 220 94 L 252 94" stroke="#64748b" stroke-width="1.2" marker-end="url(#s-arr)"/>
  <path d="M 268 94 L 288 94" stroke="#64748b" stroke-width="1.2" marker-end="url(#s-arr)"/>
  <path d="M 289 42 L 260 86" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#s-arr)"/>

  <!-- Layer 0: Bottom Layer (REFLEX / COLLIDE) -->
  <rect x="10" y="136" width="440" height="66" rx="4" fill="#f0fdf4" stroke="#4ade80" stroke-width="0.8" stroke-dasharray="4 3"/>
  <rect x="16" y="140" width="128" height="15" rx="3" fill="#059669"/>
  <text x="80" y="150" text-anchor="middle" font-size="6.2" font-weight="bold" fill="#ffffff">Layer 0: REFLEX / COLLIDE</text>

  <!-- FEEL FORCE -> RUN AWAY -->
  <g filter="url(#sub-sh)">
    <rect x="150" y="146" width="56" height="22" rx="3" fill="#ffffff" stroke="#059669" stroke-width="0.9"/>
    <text x="178" y="156" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#065f46">FEEL FORCE</text>
    <text x="178" y="163" text-anchor="middle" font-size="4.5" fill="#64748b">Forces</text>
  </g>
  <path d="M 206 157 L 216 157" stroke="#64748b" stroke-width="1.1" marker-end="url(#s-arr)"/>

  <g filter="url(#sub-sh)">
    <rect x="218" y="146" width="56" height="22" rx="3" fill="#ffffff" stroke="#059669" stroke-width="0.9"/>
    <text x="246" y="156" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#065f46">RUN AWAY</text>
    <text x="246" y="163" text-anchor="middle" font-size="4.5" fill="#64748b">Steer out</text>
  </g>
  <path d="M 274 157 L 286 157" stroke="#64748b" stroke-width="1.1" marker-end="url(#s-arr)"/>

  <!-- TURN & FORWARD -->
  <g filter="url(#sub-sh)">
    <rect x="288" y="146" width="46" height="22" rx="3" fill="#ffffff" stroke="#059669" stroke-width="0.9"/>
    <text x="311" y="156" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#065f46">TURN</text>
    <text x="311" y="163" text-anchor="middle" font-size="4.5" fill="#64748b">Steering</text>
  </g>
  <path d="M 334 157 L 344 157" stroke="#64748b" stroke-width="1.1" marker-end="url(#s-arr)"/>

  <g filter="url(#sub-sh)">
    <rect x="346" y="146" width="56" height="22" rx="3" fill="#ffffff" stroke="#059669" stroke-width="0.9"/>
    <text x="374" y="156" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#065f46">FORWARD</text>
    <text x="374" y="163" text-anchor="middle" font-size="4.5" fill="#64748b">Drive motor</text>
  </g>

  <!-- SONAR -> COLLIDE HALT -->
  <g filter="url(#sub-sh)">
    <rect x="150" y="174" width="70" height="22" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="0.9"/>
    <text x="185" y="184" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#b91c1c">SONAR (Polar)</text>
    <text x="185" y="191" text-anchor="middle" font-size="4.5" fill="#64748b">Proximity scan</text>
  </g>
  <path d="M 220 185 L 236 185" stroke="#dc2626" stroke-width="1.1" marker-end="url(#s-arr-red)"/>

  <g filter="url(#sub-sh)">
    <rect x="238" y="174" width="60" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="268" y="184" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#991b1b">COLLIDE</text>
    <text x="268" y="191" text-anchor="middle" font-size="4.5" fill="#dc2626">Emergency halt</text>
  </g>
  <path d="M 298 185 L 374 185 L 374 170" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#s-arr-red)"/>
  <text x="340" y="181" font-size="4.8" font-weight="bold" fill="#dc2626">HALT</text>
</svg>
