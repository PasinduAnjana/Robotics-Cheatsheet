<svg viewBox="0 0 390 115" width="100%" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Ubuntu', 'DejaVu Sans', 'Liberation Sans', sans-serif;">
  <defs>
    <marker id="f-arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 2 L 6 5 L 0 8 z" fill="#059669" />
    </marker>
    <marker id="f-arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 2 L 6 5 L 0 8 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Panel 1: Explicit (Fixed Areas) -->
  <g transform="translate(5, 5)">
    <rect x="0" y="0" width="120" height="105" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="60" y="14" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#0369a1">Explicit: Fixed Zones</text>
    <!-- 4 partitioned quadrants -->
    <line x1="60" y1="20" x2="60" y2="88" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="8" y1="54" x2="112" y2="54" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <!-- Clustered Food items in bottom-right only -->
    <circle cx="85" cy="68" r="2.5" fill="#d97706"/>
    <circle cx="95" cy="74" r="2.5" fill="#d97706"/>
    <circle cx="88" cy="80" r="2.5" fill="#d97706"/>
    <!-- Robots trapped in empty quadrants -->
    <circle cx="34" cy="37" r="4.5" fill="#0284c7"/>
    <circle cx="86" cy="37" r="4.5" fill="#0284c7"/>
    <circle cx="34" cy="71" r="4.5" fill="#0284c7"/>
    <circle cx="82" cy="71" r="4.5" fill="#059669"/>
    <text x="60" y="98" text-anchor="middle" font-size="6" fill="#dc2626" font-weight="bold">⚠ Idle if food clustered</text>
  </g>

  <!-- Panel 2: Implicit (Repel Beacons) -->
  <g transform="translate(135, 5)">
    <rect x="0" y="0" width="120" height="105" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="60" y="14" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#047857">Implicit: Repel Beacons</text>
    <!-- Omni-repulsion circles -->
    <circle cx="35" cy="45" r="18" fill="#d1fae5" fill-opacity="0.6" stroke="#10b981" stroke-width="0.8"/>
    <circle cx="85" cy="45" r="18" fill="#d1fae5" fill-opacity="0.6" stroke="#10b981" stroke-width="0.8"/>
    <circle cx="60" cy="72" r="18" fill="#d1fae5" fill-opacity="0.6" stroke="#10b981" stroke-width="0.8"/>
    <!-- Robots and repulsion vectors -->
    <circle cx="35" cy="45" r="4" fill="#059669"/>
    <path d="M 35 45 L 20 35" stroke="#dc2626" stroke-width="1.2" marker-end="url(#f-arr-r)"/>
    <circle cx="85" cy="45" r="4" fill="#059669"/>
    <path d="M 85 45 L 100 35" stroke="#dc2626" stroke-width="1.2" marker-end="url(#f-arr-r)"/>
    <circle cx="60" cy="72" r="4" fill="#059669"/>
    <path d="M 60 72 L 60 88" stroke="#dc2626" stroke-width="1.2" marker-end="url(#f-arr-r)"/>
    <text x="60" y="98" text-anchor="middle" font-size="6" fill="#047857" font-weight="bold">Self-dispersing / Low contact</text>
  </g>

  <!-- Panel 3: Cluster Recruitment -->
  <g transform="translate(265, 5)">
    <rect x="0" y="0" width="120" height="105" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="60" y="14" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#7c3aed">Signal / Recruitment</text>
    <!-- Calling Robot at food cluster with beacon -->
    <circle cx="85" cy="55" r="28" fill="#f3e8ff" fill-opacity="0.6" stroke="#a855f7" stroke-width="0.8" stroke-dasharray="3 2"/>
    <circle cx="85" cy="55" r="5" fill="#7c3aed"/>
    <!-- Food dots -->
    <circle cx="80" cy="62" r="2" fill="#d97706"/>
    <circle cx="90" cy="62" r="2" fill="#d97706"/>
    <!-- Recruited robots moving towards beacon -->
    <circle cx="30" cy="35" r="4" fill="#0284c7"/>
    <path d="M 34 37 L 62 48" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#f-arr-g)"/>
    <circle cx="30" cy="75" r="4" fill="#0284c7"/>
    <path d="M 34 73 L 62 62" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#f-arr-g)"/>
    <text x="60" y="98" text-anchor="middle" font-size="6" fill="#6b21a8" font-weight="bold">Beacon recruits to clusters</text>
  </g>
</svg>
