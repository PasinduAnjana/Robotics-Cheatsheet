<svg viewBox="0 0 380 95" width="100%" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Ubuntu', 'DejaVu Sans', 'Liberation Sans', sans-serif;">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 2 L 6 5 L 0 8 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Profile 1: Constant Magnitude -->
  <g transform="translate(10, 5)">
    <rect x="0" y="0" width="112" height="85" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="56" y="14" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#0369a1">Constant Magnitude</text>
    <!-- Axes -->
    <line x1="18" y1="68" x2="98" y2="68" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-gray)"/>
    <line x1="18" y1="68" x2="18" y2="22" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-gray)"/>
    <text x="14" y="26" font-size="6" fill="#64748b">m</text>
    <text x="96" y="75" font-size="6" fill="#64748b">d</text>
    <!-- Step Function -->
    <path d="M 18 32 L 65 32 L 65 68 L 92 68" fill="none" stroke="#0284c7" stroke-width="2"/>
    <text x="56" y="80" text-anchor="middle" font-size="6.2" fill="#dc2626" font-weight="bold">⚠ Jerky oscillations</text>
  </g>

  <!-- Profile 2: Linear Drop-off -->
  <g transform="translate(134, 5)">
    <rect x="0" y="0" width="112" height="85" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="56" y="14" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#047857">Linear Drop-off</text>
    <!-- Axes -->
    <line x1="18" y1="68" x2="98" y2="68" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-gray)"/>
    <line x1="18" y1="68" x2="18" y2="22" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-gray)"/>
    <text x="14" y="26" font-size="6" fill="#64748b">m</text>
    <text x="96" y="75" font-size="6" fill="#64748b">d</text>
    <!-- Linear Line -->
    <line x1="18" y1="32" x2="72" y2="68" stroke="#059669" stroke-width="2"/>
    <line x1="72" y1="68" x2="92" y2="68" stroke="#059669" stroke-width="2"/>
    <text x="56" y="80" text-anchor="middle" font-size="6.2" fill="#047857" font-weight="bold">y = m·x + b (Reflex)</text>
  </g>

  <!-- Profile 3: Exponential Drop-off -->
  <g transform="translate(258, 5)">
    <rect x="0" y="0" width="112" height="85" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="56" y="14" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#5b21b6">Exponential Drop-off</text>
    <!-- Axes -->
    <line x1="18" y1="68" x2="98" y2="68" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-gray)"/>
    <line x1="18" y1="68" x2="18" y2="22" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-gray)"/>
    <text x="14" y="26" font-size="6" fill="#64748b">m</text>
    <text x="96" y="75" font-size="6" fill="#64748b">d</text>
    <!-- Exponential Curve -->
    <path d="M 18 32 Q 35 60 92 68" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <text x="56" y="80" text-anchor="middle" font-size="6.2" fill="#5b21b6" font-weight="bold">y ∝ 1/d² (Smooth taper)</text>
  </g>
</svg>
