<svg viewBox="0 0 420 175" width="100%" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Ubuntu', 'DejaVu Sans', 'Liberation Sans', sans-serif;">
  <defs>
    <marker id="p-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 2 L 6 5 L 0 8 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- 1. Hierarchical Paradigm -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="400" height="46" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="12" y="27" font-size="7.5" font-weight="bold" fill="#1e40af">1. Hierarchical (SPA):</text>
    <!-- SENSE -->
    <rect x="110" y="10" width="65" height="26" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
    <text x="142" y="26" text-anchor="middle" font-size="7" font-weight="bold" fill="#1d4ed8">SENSE</text>
    <path d="M 175 23 L 205 23" stroke="#2563eb" stroke-width="1.3" marker-end="url(#p-arr)"/>
    <!-- PLAN -->
    <rect x="210" y="10" width="65" height="26" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <text x="242" y="26" text-anchor="middle" font-size="7" font-weight="bold" fill="#b45309">PLAN</text>
    <path d="M 275 23 L 305 23" stroke="#d97706" stroke-width="1.3" marker-end="url(#p-arr)"/>
    <!-- ACT -->
    <rect x="310" y="10" width="65" height="26" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1"/>
    <text x="342" y="26" text-anchor="middle" font-size="7" font-weight="bold" fill="#047857">ACT</text>
  </g>

  <!-- 2. Reactive Paradigm -->
  <g transform="translate(10, 60)">
    <rect x="0" y="0" width="400" height="46" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
    <text x="12" y="27" font-size="7.5" font-weight="bold" fill="#166534">2. Reactive (SA):</text>
    <!-- SENSE -->
    <rect x="110" y="10" width="65" height="26" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
    <text x="142" y="26" text-anchor="middle" font-size="7" font-weight="bold" fill="#1d4ed8">SENSE</text>
    <!-- Direct line SENSE -> ACT -->
    <path d="M 175 23 L 305 23" stroke="#059669" stroke-width="1.5" marker-end="url(#p-arr)"/>
    <text x="240" y="18" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#047857">Direct Coupling (No Plan)</text>
    <!-- ACT -->
    <rect x="310" y="10" width="65" height="26" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1"/>
    <text x="342" y="26" text-anchor="middle" font-size="7" font-weight="bold" fill="#047857">ACT</text>
  </g>

  <!-- 3. Hybrid Paradigm -->
  <g transform="translate(10, 112)">
    <rect x="0" y="0" width="400" height="56" rx="4" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8"/>
    <text x="12" y="32" font-size="7.5" font-weight="bold" fill="#5b21b6">3. Hybrid (Plan-SPA):</text>
    
    <!-- Top PLAN -->
    <rect x="210" y="6" width="65" height="20" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <text x="242" y="19" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#b45309">PLAN</text>
    <path d="M 242 26 L 242 33" stroke="#d97706" stroke-width="1.2" marker-end="url(#p-arr)"/>

    <!-- Bottom SENSE -> ACT -> ACT -->
    <rect x="110" y="32" width="65" height="20" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
    <text x="142" y="45" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#1d4ed8">SENSE</text>
    <path d="M 175 42 L 205 42" stroke="#2563eb" stroke-width="1.2" marker-end="url(#p-arr)"/>

    <rect x="210" y="32" width="65" height="20" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="242" y="45" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#6d28d9">ACT / SEQ</text>
    <path d="M 275 42 L 305 42" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#p-arr)"/>

    <rect x="310" y="32" width="65" height="20" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1"/>
    <text x="342" y="45" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#047857">ACT</text>
  </g>
</svg>
