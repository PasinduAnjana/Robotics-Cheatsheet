<svg viewBox="0 0 420 180" width="100%" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Ubuntu', 'DejaVu Sans', 'Liberation Sans', sans-serif;">
  <defs>
    <marker id="g-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 2 L 6 5 L 0 8 z" fill="#94a3b8" />
    </marker>
    <marker id="g-arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#dc2626" />
    </marker>
    <marker id="g-arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Background 2D Grid -->
  <rect x="0" y="0" width="420" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Grid Lines -->
  <path d="
    M 35 15 L 35 165 M 70 15 L 70 165 M 105 15 L 105 165 M 140 15 L 140 165 
    M 175 15 L 175 165 M 210 15 L 210 165 M 245 15 L 245 165 M 280 15 L 280 165
    M 315 15 L 315 165 M 350 15 L 350 165 M 385 15 L 385 165
    M 15 35 L 405 35 M 15 65 L 405 65 M 15 95 L 405 95 M 15 125 L 405 125 M 15 155 L 405 155
  " stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Normal Field Vectors pointing towards Goal G -->
  <!-- Top row -->
  <path d="M 45 45 L 60 45 M 80 45 L 98 47 M 115 45 L 135 48 M 150 45 L 175 52 M 290 45 L 310 55 M 325 55 L 345 70" stroke="#94a3b8" stroke-width="1.1" marker-end="url(#g-arr)"/>
  <!-- Bottom row -->
  <path d="M 45 145 L 60 145 M 80 145 L 98 143 M 115 145 L 135 142 M 150 145 L 175 138 M 290 145 L 310 135 M 325 135 L 345 120" stroke="#94a3b8" stroke-width="1.1" marker-end="url(#g-arr)"/>

  <!-- Diverging vectors around Obstacle -->
  <path d="M 185 75 Q 210 50 250 55" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#g-arr)"/>
  <path d="M 185 115 Q 210 140 250 135" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#g-arr)"/>

  <!-- Robot Node R -->
  <circle cx="45" cy="95" r="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="45" y="99" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">R</text>
  <text x="45" y="122" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#059669">Robot</text>

  <!-- Obstacle Node O -->
  <circle cx="210" cy="95" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="210" y="99" text-anchor="middle" font-size="9" font-weight="bold" fill="#991b1b">O</text>
  <text x="210" y="124" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#dc2626">Obstacle</text>

  <!-- Goal Node G -->
  <circle cx="365" cy="95" r="14" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="365" y="99" text-anchor="middle" font-size="9" font-weight="bold" fill="#3730a3">G</text>
  <text x="365" y="122" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#4f46e5">Goal</text>

  <!-- Meeting point: Local Minima (Net Force = 0) -->
  <circle cx="138" cy="95" r="4" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
  
  <!-- Opposing Force Arrows -->
  <path d="M 100 87 L 136 87" stroke="#2563eb" stroke-width="2" marker-end="url(#g-arr-blue)"/>
  <text x="118" y="80" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#2563eb">F_att →</text>

  <path d="M 175 103 L 140 103" stroke="#dc2626" stroke-width="2" marker-end="url(#g-arr-red)"/>
  <text x="157" y="115" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#dc2626">← F_rep</text>

  <!-- Callout Label -->
  <rect x="75" y="142" width="130" height="24" rx="4" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
  <text x="140" y="153" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#b45309">Local Minima: Net Force = 0</text>
  <text x="140" y="162" text-anchor="middle" font-size="5.5" fill="#64748b">F_att + F_rep = 0 (Robot Trapped!)</text>
  <path d="M 138 142 L 138 102" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 2"/>
</svg>
