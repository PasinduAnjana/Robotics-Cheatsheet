<svg viewBox="0 0 390 120" width="100%" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Ubuntu', 'DejaVu Sans', 'Liberation Sans', sans-serif;">
  <defs>
    <marker id="arr-f-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#dc2626" />
    </marker>
    <marker id="arr-f-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#059669" />
    </marker>
    <marker id="arr-f-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#0284c7" />
    </marker>
    <filter id="f-shad" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Panel 1: Separation -->
  <g transform="translate(5, 5)">
    <rect x="0" y="0" width="120" height="110" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="60" y="15" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#991b1b">1. Separation</text>
    <!-- Perception neighborhood circle -->
    <circle cx="60" cy="58" r="34" fill="#fee2e2" fill-opacity="0.5" stroke="#f87171" stroke-width="0.8" stroke-dasharray="3 2"/>
    <!-- Flockmates -->
    <polygon points="45,45 42,52 48,52" fill="#64748b"/>
    <polygon points="72,48 69,55 75,55" fill="#64748b"/>
    <polygon points="50,76 47,83 53,83" fill="#64748b"/>
    <!-- Ego Robot (Green triangle) -->
    <polygon points="60,54 55,64 65,64" fill="#10b981" stroke="#047857" stroke-width="1"/>
    <!-- Repulsion Steering Vector -->
    <path d="M 60 62 L 76 78" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-f-red)"/>
    <text x="60" y="102" text-anchor="middle" font-size="6.8" fill="#7f1d1d" font-weight="600">Avoid crowding mates</text>
  </g>

  <!-- Panel 2: Alignment -->
  <g transform="translate(135, 5)">
    <rect x="0" y="0" width="120" height="110" rx="5" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="60" y="15" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#065f46">2. Alignment</text>
    <!-- Neighborhood circle -->
    <circle cx="60" cy="58" r="34" fill="#d1fae5" fill-opacity="0.5" stroke="#34d399" stroke-width="0.8" stroke-dasharray="3 2"/>
    <!-- Flockmates heading Northeast -->
    <g transform="rotate(35 45 45)"><polygon points="45,40 41,50 49,50" fill="#64748b"/></g>
    <g transform="rotate(35 72 48)"><polygon points="72,43 68,53 76,53" fill="#64748b"/></g>
    <g transform="rotate(35 50 76)"><polygon points="50,71 46,81 54,81" fill="#64748b"/></g>
    <!-- Ego Robot -->
    <polygon points="60,54 55,64 65,64" fill="#10b981" stroke="#047857" stroke-width="1"/>
    <!-- Alignment Steering Vector -->
    <path d="M 60 56 L 76 40" stroke="#059669" stroke-width="2" marker-end="url(#arr-f-green)"/>
    <text x="60" y="102" text-anchor="middle" font-size="6.8" fill="#064e3b" font-weight="600">Match average heading</text>
  </g>

  <!-- Panel 3: Cohesion -->
  <g transform="translate(265, 5)">
    <rect x="0" y="0" width="120" height="110" rx="5" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="60" y="15" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#0369a1">3. Cohesion</text>
    <!-- Neighborhood circle -->
    <circle cx="56" cy="58" r="34" fill="#e0f2fe" fill-opacity="0.5" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 2"/>
    <!-- Flockmates & Center of Mass dot -->
    <polygon points="42,44 38,52 46,52" fill="#64748b"/>
    <polygon points="68,46 64,54 72,54" fill="#64748b"/>
    <polygon points="48,74 44,82 52,82" fill="#64748b"/>
    <circle cx="53" cy="56" r="3" fill="#0284c7"/>
    <!-- Ego Robot at edge -->
    <polygon points="84,54 79,64 89,64" fill="#10b981" stroke="#047857" stroke-width="1"/>
    <!-- Cohesion Steering Vector toward centroid -->
    <path d="M 80 58 L 59 57" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-f-blue)"/>
    <text x="60" y="102" text-anchor="middle" font-size="6.8" fill="#0c4a6e" font-weight="600">Steer toward centroid</text>
  </g>
</svg>
