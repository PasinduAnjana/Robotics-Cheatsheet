<svg viewBox="0 0 390 105" width="100%" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Ubuntu', 'DejaVu Sans', 'Liberation Sans', sans-serif;">
  <defs>
    <filter id="m-shad" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="0" y="0" width="390" height="105" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8"/>

  <!-- Box 1: Revenue -->
  <g filter="url(#m-shad)">
    <rect x="8" y="10" width="124" height="85" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <text x="70" y="24" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#b45309">Revenue (R)</text>
    <text x="70" y="35" text-anchor="middle" font-size="5.8" fill="#475569">Based on information gained</text>
    <rect x="13" y="42" width="114" height="22" rx="3" fill="#fef3c7"/>
    <text x="70" y="53" text-anchor="middle" font-size="5.4" font-weight="bold" fill="#92400e">R = (# of unknown cells)</text>
    <text x="70" y="61" text-anchor="middle" font-size="5.4" font-weight="bold" fill="#92400e">x (weighting factor)</text>
    <text x="70" y="80" text-anchor="middle" font-size="5.5" fill="#64748b">Information gained near goal</text>
  </g>

  <!-- Minus Symbol -->
  <circle cx="143" cy="52" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="143" y="56" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">−</text>

  <!-- Box 2: Cost -->
  <g filter="url(#m-shad)">
    <rect x="154" y="10" width="106" height="85" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <text x="207" y="24" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#991b1b">Cost</text>
    <text x="207" y="35" text-anchor="middle" font-size="5.8" fill="#475569">Based on distance traveled</text>
    <rect x="160" y="42" width="94" height="22" rx="3" fill="#fee2e2"/>
    <text x="207" y="53" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#b91c1c">Distance traveled</text>
    <text x="207" y="61" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#b91c1c">to reach goal</text>
    <text x="207" y="80" text-anchor="middle" font-size="5.5" fill="#64748b">Travel cost on grid</text>
  </g>

  <!-- Equals Symbol -->
  <circle cx="270" cy="52" r="9" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="270" y="56" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">=</text>

  <!-- Box 3: Team Profit -->
  <g filter="url(#m-shad)">
    <rect x="280" y="10" width="102" height="85" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1"/>
    <text x="331" y="24" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#065f46">Team Profit</text>
    <text x="331" y="35" text-anchor="middle" font-size="5.6" fill="#475569">Sum of individual profits</text>
    <rect x="285" y="42" width="92" height="22" rx="3" fill="#d1fae5"/>
    <text x="331" y="53" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#047857">Team profit =</text>
    <text x="331" y="61" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#047857">sum of indiv. profits</text>
    <text x="331" y="76" text-anchor="middle" font-size="5.2" fill="#065f46">When robots maximize</text>
    <text x="331" y="85" text-anchor="middle" font-size="5.2" fill="#065f46">profit, whole team gains</text>
  </g>
</svg>
